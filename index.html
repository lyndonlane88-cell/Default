<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Financial Journal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f7fa;
      color: #2d3748;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .date-nav button {
      background: none;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 1rem;
      color: #4a5568;
    }

    .date-nav button:hover { background: #edf2f7; }

    #current-date {
      font-size: 1rem;
      font-weight: 600;
      color: #4a5568;
    }

    /* Summary cards */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .card label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #718096;
      margin-bottom: 6px;
    }

    .card .amount {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .income-card .amount  { color: #38a169; }
    .expense-card .amount { color: #e53e3e; }
    .balance-card .amount { color: #3182ce; }

    /* Entry form */
    .form-section {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      margin-bottom: 24px;
    }

    .form-section h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr auto;
      gap: 8px;
      align-items: end;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      color: #718096;
      margin-bottom: 4px;
    }

    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.9rem;
      background: #fff;
      color: #2d3748;
    }

    .field input:focus, .field select:focus {
      outline: none;
      border-color: #4299e1;
      box-shadow: 0 0 0 3px rgba(66,153,225,.15);
    }

    .btn-add {
      padding: 8px 18px;
      background: #4299e1;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      height: 36px;
    }

    .btn-add:hover { background: #3182ce; }

    /* Entries list */
    .entries-section {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .entries-section h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .entries-list {
      list-style: none;
    }

    .entry-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #edf2f7;
      gap: 12px;
    }

    .entry-item:last-child { border-bottom: none; }

    .entry-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .type-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .badge-income  { background: #c6f6d5; color: #276749; }
    .badge-expense { background: #fed7d7; color: #9b2c2c; }

    .entry-desc {
      font-size: 0.88rem;
      color: #4a5568;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-category {
      font-size: 0.75rem;
      color: #a0aec0;
      white-space: nowrap;
    }

    .entry-amount {
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .amount-income  { color: #38a169; }
    .amount-expense { color: #e53e3e; }

    .btn-delete {
      background: none;
      border: none;
      color: #cbd5e0;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
      line-height: 1;
    }

    .btn-delete:hover { color: #e53e3e; }

    .empty-state {
      text-align: center;
      padding: 32px 0;
      color: #a0aec0;
      font-size: 0.9rem;
    }

    @media (max-width: 560px) {
      .form-row { grid-template-columns: 1fr 1fr; }
      .field.desc-field { grid-column: 1 / -1; }
      .btn-add { grid-column: 1 / -1; width: 100%; height: auto; padding: 10px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Daily Financial Journal</h1>

  <div class="date-nav">
    <button id="prev-day">&#8592;</button>
    <span id="current-date"></span>
    <button id="next-day">&#8594;</button>
  </div>

  <div class="summary">
    <div class="card income-card">
      <label>Income</label>
      <div class="amount" id="total-income">$0.00</div>
    </div>
    <div class="card expense-card">
      <label>Expenses</label>
      <div class="amount" id="total-expenses">$0.00</div>
    </div>
    <div class="card balance-card">
      <label>Balance</label>
      <div class="amount" id="balance">$0.00</div>
    </div>
  </div>

  <div class="form-section">
    <h2>Add Entry</h2>
    <div class="form-row">
      <div class="field">
        <label for="entry-type">Type</label>
        <select id="entry-type">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <div class="field">
        <label for="entry-amount">Amount ($)</label>
        <input type="number" id="entry-amount" placeholder="0.00" min="0" step="0.01" />
      </div>
      <div class="field desc-field">
        <label for="entry-desc">Description</label>
        <input type="text" id="entry-desc" placeholder="e.g. Salary, Groceries…" maxlength="80" />
      </div>
      <button class="btn-add" id="btn-add">+ Add</button>
    </div>
  </div>

  <div class="entries-section">
    <h2>Today's Entries</h2>
    <ul class="entries-list" id="entries-list"></ul>
  </div>
</div>

<script>
  const STORAGE_KEY = 'fin_journal_v1';

  // ── State ────────────────────────────────────────────────────
  let viewDate = todayKey();

  function todayKey() {
    return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  }

  function formatDisplay(key) {
    // key = YYYY-MM-DD
    const [y, m, d] = key.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function shiftDate(key, days) {
    const [y, m, d] = key.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    dt.setDate(dt.getDate() + days);
    return dt.toISOString().slice(0, 10);
  }

  // ── Storage ──────────────────────────────────────────────────
  function loadAll() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function saveAll(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getEntries(dateKey) {
    return loadAll()[dateKey] || [];
  }

  function saveEntry(dateKey, entry) {
    const all = loadAll();
    if (!all[dateKey]) all[dateKey] = [];
    all[dateKey].push(entry);
    saveAll(all);
  }

  function deleteEntry(dateKey, id) {
    const all = loadAll();
    if (!all[dateKey]) return;
    all[dateKey] = all[dateKey].filter(e => e.id !== id);
    saveAll(all);
  }

  // ── Rendering ────────────────────────────────────────────────
  function fmt(n) {
    return '$' + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function render() {
    document.getElementById('current-date').textContent = formatDisplay(viewDate);

    const entries = getEntries(viewDate);
    const income   = entries.filter(e => e.type === 'income' ).reduce((s, e) => s + e.amount, 0);
    const expenses = entries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
    const balance  = income - expenses;

    document.getElementById('total-income').textContent   = fmt(income);
    document.getElementById('total-expenses').textContent = fmt(expenses);
    const balEl = document.getElementById('balance');
    balEl.textContent = (balance < 0 ? '-' : '') + fmt(balance);
    balEl.style.color = balance < 0 ? '#e53e3e' : '#3182ce';

    const list = document.getElementById('entries-list');
    if (entries.length === 0) {
      list.innerHTML = '<li class="empty-state">No entries yet for this day.</li>';
      return;
    }

    list.innerHTML = entries.map(e => `
      <li class="entry-item">
        <div class="entry-left">
          <span class="type-badge badge-${e.type}">${e.type}</span>
          <span class="entry-desc">${escape(e.desc) || '—'}</span>
        </div>
        <span class="entry-amount amount-${e.type}">${e.type === 'expense' ? '-' : '+'}${fmt(e.amount)}</span>
        <button class="btn-delete" data-id="${e.id}" title="Delete">&#x2715;</button>
      </li>
    `).join('');

    list.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', () => {
        deleteEntry(viewDate, btn.dataset.id);
        render();
      });
    });
  }

  function escape(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Event listeners ──────────────────────────────────────────
  document.getElementById('prev-day').addEventListener('click', () => {
    viewDate = shiftDate(viewDate, -1);
    render();
  });

  document.getElementById('next-day').addEventListener('click', () => {
    viewDate = shiftDate(viewDate, 1);
    render();
  });

  document.getElementById('btn-add').addEventListener('click', () => {
    const type   = document.getElementById('entry-type').value;
    const amount = parseFloat(document.getElementById('entry-amount').value);
    const desc   = document.getElementById('entry-desc').value.trim();

    if (!amount || amount <= 0) {
      document.getElementById('entry-amount').focus();
      return;
    }

    saveEntry(viewDate, {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      type,
      amount,
      desc,
    });

    document.getElementById('entry-amount').value = '';
    document.getElementById('entry-desc').value   = '';
    render();
  });

  // Allow pressing Enter in description field to submit
  document.getElementById('entry-desc').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-add').click();
  });

  // ── Init ─────────────────────────────────────────────────────
  render();
</script>
</body>
</html>
