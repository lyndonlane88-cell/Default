<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FastLane Courier Services" />
  <meta property="og:title" content="FastLane Courier Services | Get Started" />
  <meta property="og:description" content="Become a FastLane client or apply to drive for FastLane Courier Services LLC — St. Louis's same-day courier." />
  <meta property="og:url" content="https://fastlanecourierservices.com/link.html" />
  <meta property="og:image" content="https://fastlanecourierservices.com/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FastLane Courier Services | Get Started" />
  <meta name="twitter:description" content="Become a FastLane client or apply to drive for FastLane Courier Services LLC — St. Louis's same-day courier." />
  <meta name="twitter:image" content="https://fastlanecourierservices.com/assets/og-image.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body { background: var(--navy); min-height: 100vh; }
    .link-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      text-align: center;
    }
    .link-logo { width: 220px; max-width: 70vw; height: auto; margin-bottom: 8px; }
    .link-tagline {
      color: var(--gray-200);
      font-size: 0.95rem;
      margin-bottom: 40px;
      letter-spacing: 0.02em;
    }
    .link-stack {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 20px 22px;
      border-radius: var(--radius-lg);
      text-align: left;
      transition: var(--transition);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .link-card-client { background: var(--red); border-color: var(--red); }
    .link-card-client:hover { background: var(--red-dark); transform: translateY(-2px); }
    .link-card-driver { background: rgba(255,255,255,0.06); }
    .link-card-driver:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }
    .link-card-icon {
      width: 44px; height: 44px; flex-shrink: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: var(--white);
    }
    .link-card-title { color: var(--white); font-weight: 700; font-size: 1.05rem; margin-bottom: 2px; }
    .link-card-desc { color: rgba(255,255,255,0.75); font-size: 0.825rem; }
    .link-card-arrow { margin-left: auto; color: rgba(255,255,255,0.6); }
    .link-footer {
      margin-top: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .link-footer a.link-secondary {
      color: var(--gray-200);
      font-size: 0.85rem;
      text-decoration: underline;
    }
    .link-footer .social-icon-btn { background: rgba(255,255,255,0.12); }
    .link-footer .social-icon-btn:hover { background: var(--red); }
  </style>
</head>
<body>

<div class="link-page">
  <img src="assets/logo-full-white.png" alt="FastLane Courier Services" class="link-logo" />
  <p class="link-tagline">Same-Day Courier &bull; Greater St. Louis</p>

  <div class="link-stack">
    <a href="quote.html" class="link-card link-card-client">
      <div class="link-card-icon"><i class="fa-solid fa-paper-plane"></i></div>
      <div>
        <div class="link-card-title">Become a Client</div>
        <div class="link-card-desc">Request a same-day delivery quote</div>
      </div>
      <div class="link-card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
    </a>

    <a href="drivers.html" class="link-card link-card-driver">
      <div class="link-card-icon"><i class="fa-solid fa-truck-fast"></i></div>
      <div>
        <div class="link-card-title">Become a Driver</div>
        <div class="link-card-desc">Apply to drive with FastLane</div>
      </div>
      <div class="link-card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
    </a>
  </div>

  <div class="link-footer">
    <a href="index.html" class="link-secondary">Visit our full website</a>
    <a href="https://www.linkedin.com/in/fastlane-courier-services-0b558b3ab/" class="social-icon-btn" target="_blank" rel="noopener noreferrer" aria-label="FastLane Courier Services on LinkedIn">
      <i class="fa-brands fa-linkedin-in"></i>
    </a>
  </div>
</div>

</body>
</html>
